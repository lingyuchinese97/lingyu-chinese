# Cập nhật dependency của web-next hằng tuần (spec mục 2).
version: 2
updates:
  - package-ecosystem: npm
    directory: /web-next
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
