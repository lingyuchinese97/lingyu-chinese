# Dev: chỉ chạy Postgres. App chạy bằng `pnpm dev` trên máy.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lingyu
      POSTGRES_PASSWORD: lingyu
      POSTGRES_DB: lingyu
    ports:
      - "5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
      - ./scripts/dev-init.sql:/docker-entrypoint-initdb.d/10-dev-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lingyu"]
      interval: 5s
      retries: 10
volumes:
  pgdata-dev:
